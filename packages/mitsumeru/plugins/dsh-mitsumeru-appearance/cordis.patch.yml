# @muen/dsh-mitsumeru-appearance profile patch layer — insert one loader entry
# for the plugin package. The entry is a normal cordis loader entry (id +
# package name); the browser half is picked up by dsh-client-modules through the
# package's dsh.client declaration, exactly like the shipped ui-* packages.
#
# NOTE: this file is YAML — comments are `#`, never `//`. A `//` line is a parse
# error, and the failure surfaces at the *next* line, which reads like a bad
# entry rather than a bad comment.
- insert:
    - id: mitsumeru-appearance
      name: '@muen/dsh-mitsumeru-appearance'
