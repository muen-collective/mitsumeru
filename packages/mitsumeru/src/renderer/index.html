<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The loading screen: the surface a person sees before the harness exists.

      It is deliberately self-contained — the typeface is local and nothing is
      fetched. A splash that waits on a network call is a splash that sometimes
      never appears.

      Type: JetBrains Mono (SIL OFL 1.1, see brand/OFL.txt), the monospace the
      harness UI itself reads in — so the splash and the product share one voice.
      Weight 400 body, 500/700 available.

      No mark here (2026-09-11): the app icon already says who this is, in the
      Dock and in the dmg. Repeating it full-size on a screen that is on for a
      second read as a second logo, not as a loading state, and the icons' type
      could not survive the scale anyway. What is left is the only thing the
      screen has to say: that the thing is starting.

      White-label (epic 87, P9d): once the brand store exists, this file reads it
      and shows the client's line instead of ours, before the harness has
      finished booting. Until then it shows ours, and `verify:surfaces` asserts
      the line is present rather than trusting the eye.

      The copy is short on purpose: it is on screen for a second or two, and it
      is the only place we speak before the product does.
    -->
    <title>Mitsumeru</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #191a1a;
        color: #f2f2f2;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .stage {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        /* The window is dark and empty for a moment; a whisper of motion keeps
           it from reading as a hang. */
        animation: settle 420ms ease-out both;
      }
      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .line {
        font-size: 19px;
        letter-spacing: 0.18em;
        text-transform: lowercase;
        color: #8a8a8a;
        white-space: nowrap;
      }
      .line .prompt {
        color: #e00000;
      }
      .line .caret {
        display: inline-block;
        width: 0.42em;
        height: 1em;
        margin-left: 0.22em;
        background: #e00000;
        vertical-align: -0.14em;
        animation: blink 1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .tagline {
        font-size: 20px;
        letter-spacing: 0.02em;
        color: #f2f2f2;
      }
      /* Respect the system setting: a blinking caret is exactly the kind of
         thing that setting exists for. */
      @media (prefers-reduced-motion: reduce) {
        .stage {
          animation: none;
        }
        .line .caret {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="line"><span class="prompt">+</span> starting mitsumeru<span class="caret"></span></p>
      <p class="tagline">The liberation begins here</p>
    </div>
  </body>
</html>
