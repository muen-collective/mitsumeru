<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mitsumeru — your local-first AI workspace</title>
<meta name="description" content="Mitsumeru is a local-first AI workspace built on the Mitsu harness. Sessions, workspaces, and keys stay on your machine. Download for macOS." />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
<style>
:root {
  color-scheme: dark;
  --bg: #18181b;
  --card: #101013;
  --muted: #2e2e33;
  --fg: #f0f0f2;
  --muted-fg: #9d9da3;
  --border: #3d3d44;
  --primary: #679efe;
  --primary-fg: #ffffff;
  --radius: 14px;
  --font: 'Satoshi', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* Header */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: rgba(24, 24, 27, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(61, 61, 68, 0.5);
}
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand .name { font-weight: 700; font-size: 19px; letter-spacing: 0.02em; color: #fff; }
.brand .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--primary); }
header a.gh {
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
header a.gh:hover { color: #fff; }

/* Hero — fullscreen video */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.heroVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.heroContent {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  text-align: center;
  padding: 0 24px;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
  z-index: 1;
  pointer-events: none;
}
/* Wordmark — 8-bit glitch effect (CodePen RaEOaj) */
.wordmark {
  position: relative;
  display: inline-block;
  line-height: 1;
  cursor: default;
}
.wordmarkText {
  font-family: var(--font);
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #fff;
  position: relative;
  display: inline-block;
}
.wordmarkDot {
  display: inline-block;
  width: 14px;
  height: 14px;
  background: #ff0000;
  border-radius: 2px;
  margin-left: 4px;
  vertical-align: baseline;
  position: relative;
  top: -4px;
}
/* Download button — pill + Apple logo */
.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  background: var(--primary);
  color: var(--primary-fg);
  border: none;
  border-radius: 999px;
  font-family: var(--font);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.15s ease;
  box-shadow: 0 4px 24px rgba(103, 158, 254, 0.35);
}
.dl-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.dl-btn svg { flex: none; }

/* Scroll indicator */
.scrollHint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .dl-btn { transition: none; }
}
</style>
</head>
<body>

<header>
  <div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between;">
    <div class="brand"><span class="name">Mitsumeru</span><span class="dot"></span></div>
    <a class="gh" href="https://github.com/muen-collective/mitsumeru-desktop" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
</header>

<section class="hero">
  <video class="heroVideo" src="hero-video.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
  <div class="heroContent">
    <div class="wordmark"><span class="wordmarkText">Mitsumeru</span><span class="wordmarkDot"></span></div>
    <a class="dl-btn" id="dlBtn" href="https://github.com/muen-collective/mitsumeru-desktop/releases/download/0.1.2/mitsumeru-mac-arm64.dmg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="24" height="24" aria-hidden="true"><path d="M447.1 332.7C446.9 296 463.5 268.3 497.1 247.9C478.3 221 449.9 206.2 412.4 203.3C376.9 200.5 338.1 224 323.9 224C308.9 224 274.5 204.3 247.5 204.3C191.7 205.2 132.4 248.8 132.4 337.5C132.4 363.7 137.2 390.8 146.8 418.7C159.6 455.4 205.8 545.4 254 543.9C279.2 543.3 297 526 329.8 526C361.6 526 378.1 543.9 406.2 543.9C454.8 543.2 496.6 461.4 508.8 424.6C443.6 393.9 447.1 334.6 447.1 332.7zM390.5 168.5C417.8 136.1 415.3 106.6 414.5 96C390.4 97.4 362.5 112.4 346.6 130.9C329.1 150.7 318.8 175.2 321 202.8C347.1 204.8 370.9 191.4 390.5 168.5z" fill="currentColor"/></svg>
      Download for macOS
    </a>
  </div>
</section>


<script>
(async () => {
  try {
    const response = await fetch(
      'https://api.github.com/repos/muen-collective/mitsumeru-desktop/releases?per_page=1',
      { headers: { accept: 'application/vnd.github+json' } }
    )
    if (!response.ok) return
    const [release] = await response.json()
    if (!release || !Array.isArray(release.assets)) return
    const asset = release.assets.find(
      (a) => a.name === 'mitsumeru-mac-arm64.dmg' && a.browser_download_url
    )
    if (asset) {
      document.getElementById('dlBtn').href = asset.browser_download_url
    }
  } catch {
    // Keep static fallback link
  }
})()
</script>
</body>
</html>
