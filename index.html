<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mitsumeru — your local-first AI workspace</title>
<meta name="description" content="Mitsumeru is a local-first AI workspace built on the Mitsu harness. Sessions, workspaces, and keys stay on your machine. Download for macOS." />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
<style>
:root {
  color-scheme: dark;
  --bg: #18181b;
  --card: #101013;
  --muted: #2e2e33;
  --fg: #f0f0f2;
  --muted-fg: #9d9da3;
  --border: #3d3d44;
  --primary: #679efe;
  --primary-fg: #ffffff;
  --radius: 14px;
  --font: 'Satoshi', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* Header */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: rgba(24, 24, 27, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(61, 61, 68, 0.5);
}
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand .name { font-weight: 700; font-size: 19px; letter-spacing: 0.02em; color: #fff; }
.brand .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--primary); }
header a.gh {
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
header a.gh:hover { color: #fff; }

/* Hero — fullscreen video */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.heroVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.heroContent {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  text-align: center;
  padding: 0 24px;
}
/* Wordmark — 8-bit glitch effect (CodePen RaEOaj) */
.wordmark {
  position: relative;
  display: inline-block;
  line-height: 1;
  cursor: default;
}
.wordmarkText {
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(48px, 8vw, 80px);
  font-weight: bold;
  color: #a5a5ff;
  position: relative;
  display: inline-block;
}
/* Glitch pseudo-elements — exact CodePen implementation */
.wordmarkText::before,
.wordmarkText::after {
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  animation-direction: alternate-reverse;
  overflow: hidden;
  position: absolute;
  top: 0;
  clip: rect(0, 900px, 0, 0);
  content: attr(data-text);
}
.wordmarkText::after {
  animation-name: glitch-animation;
  animation-duration: 4s;
  left: 4px;
  text-shadow: -1px 0 #ffa800;
  background: #18181b;
}
.wordmarkText::before {
  animation-name: glitch-animation-2;
  animation-duration: 6s;
  left: -4px;
  text-shadow: 1px 0 #00d8ff;
  background: #18181b;
}
@keyframes glitch-animation {
  0%   { clip: rect(42px, 9999px, 44px, 0); }
  5%   { clip: rect(12px, 9999px, 59px, 0); }
  10%  { clip: rect(48px, 9999px, 29px, 0); }
  15%  { clip: rect(42px, 9999px, 73px, 0); }
  20%  { clip: rect(63px, 9999px, 27px, 0); }
  25%  { clip: rect(34px, 9999px, 55px, 0); }
  30%  { clip: rect(86px, 9999px, 73px, 0); }
  35%  { clip: rect(20px, 9999px, 20px, 0); }
  40%  { clip: rect(26px, 9999px, 60px, 0); }
  45%  { clip: rect(25px, 9999px, 66px, 0); }
  50%  { clip: rect(57px, 9999px, 98px, 0); }
  55%  { clip: rect(5px, 9999px, 46px, 0); }
  60%  { clip: rect(82px, 9999px, 31px, 0); }
  65%  { clip: rect(54px, 9999px, 27px, 0); }
  70%  { clip: rect(28px, 9999px, 99px, 0); }
  75%  { clip: rect(45px, 9999px, 69px, 0); }
  80%  { clip: rect(23px, 9999px, 85px, 0); }
  85%  { clip: rect(54px, 9999px, 84px, 0); }
  90%  { clip: rect(45px, 9999px, 47px, 0); }
  95%  { clip: rect(37px, 9999px, 20px, 0); }
  100% { clip: rect(4px, 9999px, 91px, 0); }
}
@keyframes glitch-animation-2 {
  0%   { clip: rect(65px, 9999px, 100px, 0); }
  5%   { clip: rect(52px, 9999px, 74px, 0); }
  10%  { clip: rect(79px, 9999px, 85px, 0); }
  15%  { clip: rect(75px, 9999px, 5px, 0); }
  20%  { clip: rect(67px, 9999px, 61px, 0); }
  25%  { clip: rect(14px, 9999px, 79px, 0); }
  30%  { clip: rect(1px, 9999px, 66px, 0); }
  35%  { clip: rect(86px, 9999px, 30px, 0); }
  40%  { clip: rect(23px, 9999px, 98px, 0); }
  45%  { clip: rect(85px, 9999px, 72px, 0); }
  50%  { clip: rect(71px, 9999px, 75px, 0); }
  55%  { clip: rect(2px, 9999px, 48px, 0); }
  60%  { clip: rect(30px, 9999px, 16px, 0); }
  65%  { clip: rect(59px, 9999px, 50px, 0); }
  70%  { clip: rect(41px, 9999px, 62px, 0); }
  75%  { clip: rect(2px, 9999px, 82px, 0); }
  80%  { clip: rect(47px, 9999px, 73px, 0); }
  85%  { clip: rect(3px, 9999px, 27px, 0); }
  90%  { clip: rect(26px, 9999px, 55px, 0); }
  95%  { clip: rect(42px, 9999px, 97px, 0); }
  100% { clip: rect(38px, 9999px, 49px, 0); }
}
.wordmarkDot {
  display: inline-block;
  width: 20px;
  height: 20px;
  background: #e0485c;
  margin-left: 6px;
  vertical-align: baseline;
  position: relative;
  top: -6px;
}
.heroTagline {
  font-size: 18px;
  color: rgba(255,255,255,0.75);
  max-width: 520px;
  line-height: 1.6;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.heroTagline strong { color: #fff; font-weight: 500; }

/* Download button — pixel grid hover */
.dl-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  background: transparent;
  color: var(--primary-fg);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 4px;
  font-family: var(--font);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  z-index: 1;
}
.dl-btn svg { flex: none; position: relative; z-index: 2; }
.dl-btn span { position: relative; z-index: 2; }

/* Pixel grid overlay */
.pixel-grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(var(--cols, 28), 1fr);
  grid-template-rows: repeat(var(--rows, 6), 1fr);
  gap: 0;
  border-radius: 4px;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}
.pixel-grid .px {
  background: var(--primary);
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.dl-btn:hover .px {
  opacity: 1;
  transform: scale(1);
  transition-delay: var(--d, 0s);
}
.dl-btn:hover { border-color: var(--primary); }

/* Scroll indicator */
.scrollHint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .dl-btn { transition: none; }
}
</style>
</head>
<body>

<header>
  <div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between;">
    <div class="brand"><span class="name">Mitsumeru</span><span class="dot"></span></div>
    <a class="gh" href="https://github.com/muen-collective/mitsumeru-desktop" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
</header>

<section class="hero">
  <video class="heroVideo" src="hero-video.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
  <div class="heroContent">
    <div class="wordmark"><span class="wordmarkText" data-text="Mitsumeru">Mitsumeru</span><span class="wordmarkDot"></span></div>
    <p class="heroTagline">The liberation begins here</p>
    <a class="dl-btn" id="dlBtn" href="https://github.com/muen-collective/mitsumeru-desktop/releases/download/0.1.2/mitsumeru-mac-arm64.dmg">
      <div class="pixel-grid" id="pixelGrid"></div>
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.7 8.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.2-2.8.9-3.6.9s-2-.8-3.2-.8c-1.7 0-3.2 1-4.1 2.5-1.7 3.1-.4 7.8 1.3 10.3.8 1.3 1.8 2.6 3.1 2.6 1.2 0 1.7-.8 3.2-.8s2 .8 3.2.8 2.1-1.3 2.9-2.5c.9-1.4 1.3-2.8 1.3-2.8-.1 0-2.5-1-2.5-4zm-3-7.4c.7-.8 1.1-2 .9-3.1-1 0-2.2.7-2.9 1.5-.7.7-1.2 1.9-1 3.1 1 .1 2.1-.6 2.8-1.4z" fill="currentColor"/></svg>
      <span>Download for macOS</span>
    </a>
  </div>
</section>


<script>
// Pixel grid: generate cells with staggered fade-in delays
(() => {
  const grid = document.getElementById('pixelGrid')
  if (!grid) return
  const COLS = 30
  const ROWS = 7
  grid.style.setProperty('--cols', COLS)
  grid.style.setProperty('--rows', ROWS)
  const cells = []
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const px = document.createElement('span')
      px.className = 'px'
      // Distance from top-left corner for diagonal wave
      const delay = (r + c) * 0.01
      px.style.setProperty('--d', delay + 's')
      grid.appendChild(px)
      cells.push({ el: px, r, c })
    }
  }

  // On mouseenter, recalculate delays based on actual mouse position
  const btn = grid.parentElement
  btn.addEventListener('mouseenter', (e) => {
    const rect = btn.getBoundingClientRect()
    const mx = (e.clientX - rect.left) / rect.width
    const my = (e.clientY - rect.top) / rect.height
    for (const cell of cells) {
      const cx = (cell.c + 0.5) / COLS
      const cy = (cell.r + 0.5) / ROWS
      const dist = Math.sqrt((cx - mx) ** 2 + (cy - my) ** 2)
      cell.el.style.setProperty('--d', (dist * 0.4) + 's')
    }
  })
})()

(async () => {
  try {
    const response = await fetch(
      'https://api.github.com/repos/muen-collective/mitsumeru-desktop/releases?per_page=1',
      { headers: { accept: 'application/vnd.github+json' } }
    )
    if (!response.ok) return
    const [release] = await response.json()
    if (!release || !Array.isArray(release.assets)) return
    const asset = release.assets.find(
      (a) => a.name === 'mitsumeru-mac-arm64.dmg' && a.browser_download_url
    )
    if (asset) {
      document.getElementById('dlBtn').href = asset.browser_download_url
    }
  } catch {
    // Keep static fallback link
  }
})()
</script>
</body>
</html>
