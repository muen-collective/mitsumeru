<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mitsumeru — your local-first AI workspace</title>
<meta name="description" content="Mitsumeru is a local-first AI workspace built on the Mitsu harness. Sessions, workspaces, and keys stay on your machine. Download for macOS." />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
<style>
:root {
  color-scheme: dark;
  --bg: #18181b;
  --card: #101013;
  --muted: #2e2e33;
  --fg: #f0f0f2;
  --muted-fg: #9d9da3;
  --border: #3d3d44;
  --primary: #679efe;
  --primary-fg: #ffffff;
  --radius: 14px;
  --font: 'Satoshi', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* Header */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: rgba(24, 24, 27, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(61, 61, 68, 0.5);
}
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand .name { font-weight: 700; font-size: 19px; letter-spacing: 0.02em; color: #fff; }
.brand .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--primary); }
header a.gh {
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
header a.gh:hover { color: #fff; }

/* Hero — fullscreen video */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.heroVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.heroContent {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  text-align: center;
  padding: 0 24px;
}
/* Wordmark — Satoshi bold, white text + red dot */
.wordmark {
  display: flex;
  align-items: baseline;
  gap: 0;
  line-height: 1;
  cursor: default;
}
.wordmarkText {
  font-family: var(--font);
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #fff;
}
.wordmarkDot {
  display: inline-block;
  width: 20px;
  height: 20px;
  background: #e0485c;
  margin-left: 6px;
  vertical-align: baseline;
  position: relative;
  top: -6px;
}
/* Pseudo-code line — VSCode / Maple Mono colors */
.heroCode {
  font-family: var(--mono);
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 500;
  line-height: 1.5;
  color: #d4d4d4;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
/* VSCode syntax colors */
.hl-comment { color: #6a9955; }
.hl-keyword { color: #569cd6; }
.hl-string { color: #ce9178; }
.hl-dim { color: #808080; }
.hl-func { color: #dcdcaa; }
.hl-type { color: #4ec9b0; }
.hl-punct { color: #808080; }
.heroCode .dl-link {
  color: #569cd6;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
  cursor: pointer;
}
.heroCode .dl-link:hover {
  border-bottom-color: #569cd6;
}
.heroCode .dl-link .dl-label {
  color: #ce9178;
}

/* Scroll indicator */
.scrollHint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .dl-btn { transition: none; }
}
</style>
</head>
<body>

<header>
  <div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between;">
    <div class="brand"><span class="name">Mitsumeru</span><span class="dot"></span></div>
    <a class="gh" href="https://github.com/muen-collective/mitsumeru-desktop" target="_blank" rel="noopener">Source on GitHub</a>
  </div>
</header>

<section class="hero">
  <video class="heroVideo" src="hero-video.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
  <div class="heroContent">
    <div class="wordmark"><span class="wordmarkText">Mitsumeru</span><span class="wordmarkDot"></span></div>
    <p class="heroCode">
      <span class="hl-comment">//The liberation begins here.//</span>
      <span class="hl-dim">----</span>
      <a class="dl-link" id="dlBtn" href="https://github.com/muen-collective/mitsumeru-desktop/releases/download/0.1.2/mitsumeru-mac-arm64.dmg">
        <span class="hl-keyword">[</span><span class="dl-label">download</span><span class="hl-keyword">]</span> macOS
      </a>
    </p>
  </div>
</section>


<script>
(async () => {
  try {
    const response = await fetch(
      'https://api.github.com/repos/muen-collective/mitsumeru-desktop/releases?per_page=1',
      { headers: { accept: 'application/vnd.github+json' } }
    )
    if (!response.ok) return
    const [release] = await response.json()
    if (!release || !Array.isArray(release.assets)) return
    const asset = release.assets.find(
      (a) => a.name === 'mitsumeru-mac-arm64.dmg' && a.browser_download_url
    )
    if (asset) {
      document.getElementById('dlBtn').href = asset.browser_download_url
    }
  } catch {
    // Keep static fallback link
  }
})()
</script>
</body>
</html>
